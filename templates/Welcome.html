<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Yearbook</title>
    <style>
        /* General Reset */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #0078d4;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #cce7ff;
        }

        /* Logo Styling */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 70px;
            height: 70px;
        }

        /* Main Content Styling */
        .content {
            text-align: center;
            padding: 50px 20px;
        }

        .content h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #555;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-create {
            background-color: #0078d4;
            color: white;
        }

        .btn-create:hover {
            background-color: #0056a3;
        }

        .btn-view {
            background-color: #f5f5f5;
            color: #0078d4;
            border: 2px solid #0078d4;
        }

        .btn-view:hover {
            background-color: #e0f3ff;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Yearbook</h1>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- Logo -->
    <img src="logo.png" alt="Yearbook Logo" class="logo">

    <!-- Main Content -->
    <div class="content">
        <h2>Welcome to Your Yearbook</h2>
        <p>Start creating or relive the moments by exploring the existing yearbook collection.</p>
        <div class="buttons">
        <button class="btn" onclick="location.href='/signin'">Sign In</button>
        <button class="btn" onclick="location.href='/signup'">Create Account</button>
        </div>
    </div>

</body>
</html>
